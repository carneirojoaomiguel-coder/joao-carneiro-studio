  <style>
    body { margin:0; font-family: Helvetica, Arial, sans-serif; color:#222; background:#fff; font-weight:300; }
    header { height:64px; border-bottom:1px solid #eee; display:flex; align-items:center; justify-content:space-between; padding:0 28px; box-sizing:border-box; letter-spacing:.06em; text-transform:uppercase; font-size:14px; }

    .brand { margin-left:0; color:#555; font-size:16px; }

    h1 { font-size:42px; font-weight:300; margin:0 0 28px; }
    p { font-size:18px; line-height:1.7; color:#666; }
    form { margin-top:42px; display:grid; gap:18px; }
    label { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:#666; }
    input, textarea { width:100%; box-sizing:border-box; border:1px solid #ddd; padding:15px; font:inherit; font-size:16px; background:#fff; }
    textarea { min-height:150px; resize:vertical; }
    button { justify-self:start; border:1px solid #222; background:#fff; color:#222; text-transform:uppercase; letter-spacing:.08em; font-size:13px; padding:16px 34px; cursor:pointer; }

<body>
  <header>
    <a class="brand" href="index.html">João Carneiro</a>
    <nav class="site-nav">
      <a href="works.html">Works</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <main>
    <h1>Inquire</h1>
    <p data-pt="Para pedidos de informação sobre obras, disponibilidade, aquisição ou colaboração, preencha o formulário abaixo." data-en="For enquiries about works, availability, acquisition or collaboration, please use the form below." data-fr="Pour toute demande concernant les œuvres, leur disponibilité, leur acquisition ou une collaboration, veuillez utiliser le formulaire ci-dessous.">Para pedidos de informação sobre obras, disponibilidade, aquisição ou colaboração, preencha o formulário abaixo.</p>

    <form name="inquire" method="POST" data-netlify="true" netlify="true" netlify-honeypot="bot-field" action="thank-you/">
      <input type="hidden" name="form-name" value="inquire">
      <input type="hidden" name="subject" value="Novo pedido de informação — João Carneiro">
      <p style="display:none;"><label>Não preencher: <input name="bot-field"></label></p>

      <label for="name">Nome / Name</label>
      <input id="name" name="name" type="text" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="work">Obra / Work</label>
      <input id="work" name="work" type="text">

      <label for="message">Mensagem / Message</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">Send enquiry</button>
    </form>

    <p class="email" data-pt='Email direto: <a href="mailto:studio.joaocarneiro@gmail.com">studio.joaocarneiro@gmail.com</a>' data-en='Direct email: <a href="mailto:studio.joaocarneiro@gmail.com">studio.joaocarneiro@gmail.com</a>' data-fr='Email direct : <a href="mailto:studio.joaocarneiro@gmail.com">studio.joaocarneiro@gmail.com</a>'>Email direto: <a href="mailto:studio.joaocarneiro@gmail.com">studio.joaocarneiro@gmail.com</a></p>
  </main>
