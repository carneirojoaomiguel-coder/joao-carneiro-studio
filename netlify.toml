[build]
  publish = "."

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[headers]]
  for = "/admin/config.yml"
  [headers.values]
    Content-Type = "text/yaml; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/social/whatsapp-thumbnail.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/jpeg"

[[redirects]]
  from = "/inquire"
  to = "/inquire.html"
  status = 200
[[redirects]]
  from = "/inquire/"
  to = "/inquire.html"
  status = 200
[[redirects]]
  from = "/inquires"
